# MongoDB config
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ecommerce_db}

# Brevo API key for email dispatch on Render (HTTPS, not blocked)
# Set the BREVO_API_KEY environment variable on Render dashboard
brevo.api.key=${BREVO_API_KEY:}

# Sender email address (use your Brevo verified email)
email.from=${EMAIL_FROM:electronce20@gmail.com}

# SMTP config (fallback for local development when BREVO_API_KEY is not set)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=electronce20@gmail.com
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server port
server.port=${PORT:8080}

# Frontend URL for email links (set FRONTEND_URL in Render dashboard)
frontend.url=${FRONTEND_URL:http://localhost:3000}
